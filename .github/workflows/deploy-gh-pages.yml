name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. Do NOT cancel an in-flight run: cancelling mid-deploy
# (after the github-pages artifact is uploaded but before deploy-pages runs)
# strands that artifact, and the next run then fails with "Multiple artifacts
# named github-pages ... Artifact count is 2". Queue instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static SPA
        run: npm run build:static
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # Same secret the ingest workflow uses to reach the Railway server;
          # here it lets the subscribe form POST to /api/subscribe. Unset →
          # the subscribe card simply doesn't render.
          VITE_SERVER_URL: ${{ secrets.NOTIFY_SERVER_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
